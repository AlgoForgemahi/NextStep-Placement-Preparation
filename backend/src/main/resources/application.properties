server.port=${PORT:8081}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.application.name=nextstep
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nextstep}
spring.datasource.username=${DATABASE_USER:nextstep}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.name=NEXTSTEP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=60m
server.error.include-message=never
execution.url=${EXECUTION_URL:}
execution.key=${EXECUTION_KEY:}
